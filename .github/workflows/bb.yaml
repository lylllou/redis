name: Build Redis 7.4.5 Statically

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make wget file

    - name: Download Redis source
      run: wget https://download.redis.io/redis-stable.tar.gz

    - name: Extract Redis source
      run: tar xzf redis-stable.tar.gz

    - name: Build Redis statically
      run: |
        cd redis-stable
        make CFLAGS="-static" LDFLAGS="-static"

    - name: Verify static linking
      run: |
        file redis-stable/src/redis-server
        ldd redis-stable/src/redis-server || echo "Static binary confirmed (ldd failed)"

    - name: Upload Redis binary
      uses: actions/upload-artifact@v4
      with:
        name: redis-static-binaries
        path: |
          redis-stable/src/redis-server
          redis-stable/src/redis-cli
