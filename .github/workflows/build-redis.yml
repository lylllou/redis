name: Build Redis 7.4.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Redis source
      run: |
        git clone --branch 7.4.5 https://github.com/redis/redis.git
        cd redis

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential tcl

    - name: Compile Redis
      run: |
        cd redis
        make -j$(nproc)

    - name: Run basic test
      run: |
        cd redis
        make test
        
    - name: Package Redis as tar.gz
      run: |
        cd redis
        mkdir -p redis-7.4.5-bin
        cp src/redis-server src/redis-cli src/redis-benchmark redis-7.4.5-bin/
        tar -czvf redis-7.4.5-bin.tar.gz redis-7.4.5-bin

    - name: Upload Redis binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: redis-7.4.5-bin
        path: redis/redis-7.4.5-bin.tar.gz
